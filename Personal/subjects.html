<main>

            <ul class="subject-list" id="subject-list"></ul>
                <button id="add-subject-btn">+ Add Subject</button>
    </aside>

        <main class="main-content">
        <header>
            <h2 id="current-subject-title"></h2>
        </header>

<div class="search-row" id="search-row" style="display: none;">
    <input type="text" id="input-box" placeholder="Write your task here...">
    <input type="date" id="date-box" class="datetime-input">
    <input type="time" id="time-box" class="datetime-input">
    <button id="add-btn">Add</button>
</div>

        <ul id="list-container"></ul>
    </main>
</div>

<div id="custom-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Add a New Subject</h3>
        <input type="text" id="modal-input" placeholder="Enter Subject Name...">
        <div class="modal-buttons">
            <button id="modal-ok">OK</button>
            <button id="modal-cancel">Cancel</button>
        </div>
    </div>
</div>
